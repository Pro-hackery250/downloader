<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreaming</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05010f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Orbitron', monospace;
  }
  /* Stars */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite;
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: var(--op); }
  }

  /* Scene */
  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* Rocket wrapper — animates upward infinitely */
  .rocket-wrapper {
    position: relative;
    animation: flyUp 2.8s ease-in-out infinite;
  }

  @keyframes flyUp {
    0%   { transform: translateY(60px); }
    50%  { transform: translateY(-60px); }
    100% { transform: translateY(60px); }
  }

  /* SVG Rocket */
  .rocket svg {
    width: 90px;
    height: auto;
    filter: drop-shadow(0 0 18px #ff4500) drop-shadow(0 0 40px #ff2200);
  }

  /* Flame particles */
  .flames {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .flame {
    width: 14px;
    height: 28px;
    background: radial-gradient(ellipse at top, #fff 0%, #ff6a00 30%, #ff2200 60%, transparent 100%);
    border-radius: 50% 50% 40% 40%;
    animation: flicker 0.12s ease-in-out infinite alternate;
    transform-origin: top center;
    opacity: 0.9;
  }
  .flame:nth-child(2) {
    width: 9px;
    height: 20px;
    animation-delay: 0.05s;
    background: radial-gradient(ellipse at top, #fff 0%, #ffaa00 30%, #ff4400 70%, transparent 100%);
    margin-top: -8px;
  }
  .flame:nth-child(3) {
    width: 6px;
    height: 14px;
    animation-delay: 0.09s;
    background: radial-gradient(ellipse at top, #fff 0%, #ffcc00 40%, transparent 100%);
    margin-top: -6px;
  }
  @keyframes flicker {
    from { transform: scaleX(1) scaleY(1); opacity: 0.9; }
    to   { transform: scaleX(0.75) scaleY(1.15); opacity: 1; }
  }

  /* Exhaust trail dots */
  .trail {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .trail-dot {
    border-radius: 50%;
    background: #ff4500;
    animation: fadeDot 0.6s ease-out infinite;
    animation-delay: var(--delay);
  }
  .trail-dot:nth-child(1) { width: 8px; height: 8px; opacity: 0.9; }
  .trail-dot:nth-child(2) { width: 6px; height: 6px; opacity: 0.6; }
  .trail-dot:nth-child(3) { width: 4px; height: 4px; opacity: 0.35; }
  .trail-dot:nth-child(4) { width: 3px; height: 3px; opacity: 0.15; }
  @keyframes fadeDot {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.3); }
  }

  /* Orbit ring */
  .orbit {
    position: absolute;
    width: 130px;
    height: 130px;
    border: 1px dashed rgba(255,69,0,0.25);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    animation: spinOrbit 6s linear infinite;
  }
  .orbit-dot {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    background: #ff4500;
    border-radius: 50%;
    box-shadow: 0 0 8px #ff4500, 0 0 20px #ff2200;
  }
  @keyframes spinOrbit {
    from { transform: translate(-50%,-50%) rotate(0deg); }
    to   { transform: translate(-50%,-50%) rotate(360deg); }
  }

  /* Text */
  .label {
    font-size: clamp(1.6rem, 6vw, 3.2rem);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: #ff4500;
    text-shadow:
      0 0 10px #ff4500,
      0 0 30px #ff2200,
      0 0 60px #ff000088;
    animation: blink 1.1s step-start infinite;
    text-transform: uppercase;
    white-space: nowrap;
    user-select: none;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    49.9%    { opacity: 1; }
    50%      { opacity: 0; }
    99.9%    { opacity: 0; }
  }

  /* Progress bar */
  .progress-bar {
    width: 260px;
    height: 4px;
    background: rgba(255,69,0,0.15);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff2200, #ff6a00, #ffaa00);
    border-radius: 2px;
    animation: load 3s ease-in-out infinite;
    box-shadow: 0 0 8px #ff4500;
  }
  @keyframes load {
    0%   { width: 0%; }
    80%  { width: 100%; }
    100% { width: 100%; opacity: 0; }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Scene -->
<div class="scene">
  <div class="rocket-wrapper">
    <!-- Orbit ring -->
    <div class="orbit"><div class="orbit-dot"></div></div>

    <!-- Rocket SVG -->
    <div class="rocket">
      <svg viewBox="0 0 60 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Body -->
        <path d="M30 4 C18 20 14 50 14 72 L46 72 C46 50 42 20 30 4Z" fill="#ff4500"/>
        <!-- Nose shine -->
        <path d="M30 4 C24 18 22 35 22 50 L30 50 C30 35 30 18 30 4Z" fill="#ff6633" opacity="0.5"/>
        <!-- Window -->
        <circle cx="30" cy="44" r="7" fill="#0a0020" stroke="#ff6a00" stroke-width="2"/>
        <circle cx="30" cy="44" r="4" fill="#1a0040" opacity="0.8"/>
        <circle cx="28" cy="42" r="1.5" fill="white" opacity="0.5"/>
        <!-- Left fin -->
        <path d="M14 72 L4 90 L14 84Z" fill="#cc2200"/>
        <!-- Right fin -->
        <path d="M46 72 L56 90 L46 84Z" fill="#cc2200"/>
        <!-- Body bottom -->
        <rect x="14" y="72" width="32" height="14" rx="2" fill="#dd3300"/>
        <!-- Nozzle -->
        <rect x="22" y="86" width="16" height="8" rx="3" fill="#aa1100"/>
      </svg>
    </div>

    <!-- Flame -->
    <div class="flames">
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
    </div>

    <!-- Trail -->
    <div class="trail">
      <div class="trail-dot" style="--delay:0s"></div>
      <div class="trail-dot" style="--delay:0.1s"></div>
      <div class="trail-dot" style="--delay:0.2s"></div>
      <div class="trail-dot" style="--delay:0.3s"></div>
    </div>
  </div>

  <div class="label">Dreaming</div>
  <div class="progress-bar"><div class="progress-fill"></div></div>
</div>

<script>
  // Generate stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 180; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `
      left: ${Math.random()*100}%;
      top: ${Math.random()*100}%;
      --d: ${1.5 + Math.random()*3}s;
      --op: ${0.3 + Math.random()*0.7};
      animation-delay: ${Math.random()*3}s;
      ${Math.random() > 0.85 ? 'width:3px;height:3px;' : ''}
    `;
    starsEl.appendChild(s);
  }
</script>
</body>
</html>
